name: Build & Release

# Runs on version tags (real releases), pushes to dev (test builds), or manually
on:
  push:
    tags:
      - 'v*'
    branches:
      - dev
  workflow_dispatch:

# Required for softprops/action-gh-release to create and upload releases
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # -------------------------------------------------------------------------
  # Windows
  # -------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Rebuild the bootloader from source to avoid AV false positives.
      # The default PyInstaller bootloader has a known binary signature that
      # heuristic scanners (e.g. Wacatac.B!ml) flag. Building it fresh breaks
      # that signature match. MSVC is pre-installed on windows-latest.
      - name: Rebuild PyInstaller bootloader
        run: |
          pip install pyinstaller
          git clone --depth 1 https://github.com/pyinstaller/pyinstaller.git _pyinstaller
          cd _pyinstaller/bootloader
          python ./waf all
          cd ../..
          pip install ./_pyinstaller

      - name: Build executable
        run: >
          pyinstaller
          --noconsole
          --onefile
          --collect-all customtkinter
          --hidden-import psutil
          --hidden-import pystray
          --hidden-import plyer
          --icon assets/favicon.ico
          --add-data "assets/favicon.ico;."
          --name BetterfoxUpdater
          app.py

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BetterfoxUpdater.exe
          generate_release_notes: true

      - name: Upload test build artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: BetterfoxUpdater-Windows-test
          path: dist/BetterfoxUpdater.exe
          retention-days: 14

  # -------------------------------------------------------------------------
  # macOS
  # -------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same bootloader rebuild as Windows — macOS was also flagged.
      # Xcode Command Line Tools (clang) are pre-installed on macos-latest.
      - name: Rebuild PyInstaller bootloader
        run: |
          pip install pyinstaller
          git clone --depth 1 https://github.com/pyinstaller/pyinstaller.git _pyinstaller
          cd _pyinstaller/bootloader
          python ./waf all
          cd ../..
          pip install ./_pyinstaller

      # Convert the 1024px PNG to .icns using sips + iconutil (built into macOS)
      - name: Convert PNG to icns
        run: |
          mkdir AppIcon.iconset
          sips -z 16   16   assets/AppIcon1024.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32   32   assets/AppIcon1024.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32   32   assets/AppIcon1024.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64   64   assets/AppIcon1024.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128  128  assets/AppIcon1024.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256  256  assets/AppIcon1024.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256  256  assets/AppIcon1024.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512  512  assets/AppIcon1024.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512  512  assets/AppIcon1024.png --out AppIcon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/AppIcon1024.png --out AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns AppIcon.iconset --output assets/AppIcon.icns

      - name: Build executable
        run: >
          pyinstaller
          --noconsole
          --onefile
          --collect-all customtkinter
          --hidden-import psutil
          --hidden-import pystray
          --hidden-import plyer
          --icon assets/AppIcon.icns
          --add-data "assets/AppIcon1024.png:."
          --name BetterfoxUpdater
          app.py

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BetterfoxUpdater
          generate_release_notes: true

      - name: Upload test build artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: BetterfoxUpdater-macOS-test
          path: dist/BetterfoxUpdater
          retention-days: 14

  # -------------------------------------------------------------------------
  # Linux
  # -------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tkinter is not bundled with Python on Ubuntu — must be installed separately
      - name: Install tkinter
        run: sudo apt-get install -y python3-tk

      # PyGObject (the "gi" module) provides the AppIndicator bindings pystray
      # needs to use its most reliable Linux tray backend. actions/setup-python
      # uses an isolated Python build under hostedtoolcache/, completely separate
      # from apt's system Python — so `apt install python3-gi` alone does NOT
      # make gi importable here, the same issue seen when a local venv lacks
      # --system-site-packages. The fix is to compile PyGObject directly inside
      # this job's venv via pip, which requires the native dev headers below.
      #
      # Without this, pystray silently falls back to its much less reliable
      # Xorg backend (pystray._xorg), which is known to not respond to clicks
      # on some desktop environments (confirmed on XFCE/Debian — see project
      # issues). This produces a binary users can't get out of via the tray at
      # all — see the iconify()/Quit App fallback added in app.py for the
      # user-facing safety net, independent of this fix.
      - name: Install PyGObject build dependencies and AppIndicator bindings
        run: |
          sudo apt-get install -y \
            libgirepository1.0-dev \
            gobject-introspection \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 \
            libdbus-1-dev \
            libdbus-glib-1-dev

      # plyer's Linux notification backend uses python-dbus (the `dbus`
      # module). Without it, plyer falls back to a less direct path — the
      # notification still worked in testing, but this removes the runtime
      # warning and gives plyer its intended, fully-supported backend.
      - name: Install python-dbus into the build venv
        run: pip install dbus-python

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      # Compiles gi's native bindings against the headers installed above,
      # directly inside this job's venv — making it importable by the same
      # Python that PyInstaller freezes, unlike the apt-installed system copy.
      - name: Install PyGObject into the build venv
        # Pinned below 3.52 — newer PyGObject releases require the
        # girepository-2.0 pkg-config module, which Ubuntu 24.04's
        # libgirepository1.0-dev does not provide (it only ships the
        # classic girepository-1.0). 3.50.0 still targets girepository-1.0,
        # matching what we install above.
        run: pip install "pygobject==3.50.0"

      - name: Build executable
        run: >
          pyinstaller
          --noconsole
          --onefile
          --collect-all customtkinter
          --collect-all gi
          --hidden-import psutil
          --hidden-import pystray
          --collect-submodules plyer
          --hidden-import dbus
          --hidden-import gi.repository.AppIndicator3
          --icon assets/AppIcon1024.png
          --add-data "assets/AppIcon1024.png:."
          --add-data "/usr/lib/x86_64-linux-gnu/girepository-1.0:gi_typelibs"
          --name BetterfoxUpdater-Linux
          app.py

      # --- AppImage packaging ---
      # Bundles the binary into the standard Linux desktop distribution format.
      # No system dependencies required by the end user beyond FUSE (present
      # on nearly all modern distros) — the AppImage is fully self-contained.
      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/BetterfoxUpdater-Linux AppDir/usr/bin/
          cp assets/AppIcon1024.png AppDir/betterfox-updater.png

          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/BetterfoxUpdater-Linux" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/betterfox-updater.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Betterfox Updater
          Exec=BetterfoxUpdater-Linux
          Icon=betterfox-updater
          Comment=Automatically update Betterfox user.js for Firefox
          Categories=Utility;
          StartupWMClass=Betterfoxupdater
          EOF

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir BetterfoxUpdater-x86_64.AppImage

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BetterfoxUpdater-Linux
            BetterfoxUpdater-x86_64.AppImage
          generate_release_notes: true

      - name: Upload test build artifacts
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: BetterfoxUpdater-Linux-test
          path: |
            dist/BetterfoxUpdater-Linux
            BetterfoxUpdater-x86_64.AppImage
          retention-days: 14